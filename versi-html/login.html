<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login – ArenaFutsal Academy</title>
<link rel="stylesheet" href="reveal.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar (diatur di layout.js) -->
<div id="site-nav"></div>

<main class="page">

<div class="login">
  <form class="card" id="loginForm" data-anim="zoom">
    <h2>Login</h2>
    <p class="sub">Masuk ke akun pemain/orang tua.</p>
    <label>Email<input type="email" required placeholder="nama@email.com"></label>
    <label>Password<input type="password" required placeholder="••••••••"></label>
    <button class="btn big" type="submit">Masuk</button>
    <p class="foot">Belum punya akun? <a href="pendaftaran.html">Daftar</a></p>
  </form>
</div>
</main>

<!-- Footer (diatur di layout.js) -->
<div id="site-footer"></div>

<script src="reveal.js"></script>
<script src="layout.js"></script>
<script src="login.js"></script>
</body>
</html>
