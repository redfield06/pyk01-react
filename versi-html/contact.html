<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact – ArenaFutsal Academy</title>
<link rel="stylesheet" href="reveal.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar (diatur di layout.js) -->
<div id="site-nav"></div>

<main class="page">

<div class="w">
  <h2 data-anim="down">Contact</h2>
  <p class="sub" data-anim="down" data-delay="100">Punya pertanyaan? Hubungi kami lewat kanal berikut.</p>
  <div class="ct">
    <!-- Ganti 6281234567890 dengan nomor WhatsApp admin (awali 62, tanpa 0 / tanda +) -->
    <a class="card" data-anim="left" target="_blank" rel="noopener"
       href="https://wa.me/6281234567890?text=Halo%20Min%2C%20Saya%20Ingin%20menanyakan%20Info%20Pendaftaran%20nya!">
      <div class="i" style="background:#25d366">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11 11 0 0 0 3.2 17.3L2 22l4.8-1.2A11 11 0 1 0 20.5 3.5zM12 20a9 9 0 0 1-4.6-1.3l-.3-.2-2.8.7.8-2.7-.2-.3A9 9 0 1 1 12 20zm5-6.7c-.3-.1-1.6-.8-1.9-.9s-.5-.1-.7.1-.7.9-.9 1.1-.3.2-.6.1a7.4 7.4 0 0 1-3.7-3.2c-.3-.5.3-.5.8-1.5a.6.6 0 0 0 0-.5l-.9-2.1c-.2-.5-.5-.5-.7-.5h-.6a1.2 1.2 0 0 0-.9.4 3.6 3.6 0 0 0-1.1 2.7 6.2 6.2 0 0 0 1.3 3.3 14 14 0 0 0 5.4 4.8c2 .8 2.8.9 3.8.7a3.2 3.2 0 0 0 2.1-1.5 2.6 2.6 0 0 0 .2-1.5c-.1-.1-.3-.2-.6-.3z"/></svg>
      </div>
      <div><h3>WhatsApp</h3><p>Klik untuk chat langsung dengan admin</p></div>
    </a>
    <a class="card" data-anim="right" data-delay="120" target="_blank" rel="noopener" href="https://instagram.com/username_anda">
      <div class="i" style="background:linear-gradient(45deg,#f9a825,#e1306c,#833ab4)">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      </div>
      <div><h3>Instagram</h3><p>@arenafutsal.academy</p></div>
    </a>
  </div>
</div>
</main>

<!-- Footer (diatur di layout.js) -->
<div id="site-footer"></div>
