<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery – ArenaFutsal Academy</title>
<link rel="stylesheet" href="reveal.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar (diatur di layout.js) -->
<div id="site-nav"></div>

<main class="page">

<div class="w">
  <h2 data-anim="down">Gallery</h2>
  <p class="sub" data-anim="down" data-delay="100">Dokumentasi kegiatan di akademi kami.</p>
  <div class="gal">
    <!-- Ganti foto: style="background-image:url('foto/1.jpg')" (taruh file di folder foto) -->
      <div data-anim="left" data-delay="0" style="background:linear-gradient(135deg,#2563eb,#7c3aed)">Latihan Rutin</div>
      <div data-anim="up" data-delay="100" style="background:linear-gradient(135deg,#16a34a,#65a30d)">Turnamen Antar Akademi</div>
      <div data-anim="right" data-delay="200" style="background:linear-gradient(135deg,#ea580c,#db2777)">Pembagian Jersey</div>
      <div data-anim="left" data-delay="0" style="background:linear-gradient(135deg,#0891b2,#2563eb)">Sesi Teknik</div>
      <div data-anim="up" data-delay="100" style="background:linear-gradient(135deg,#7c3aed,#db2777)">Penyerahan Piala</div>
      <div data-anim="right" data-delay="200" style="background:linear-gradient(135deg,#65a30d,#0891b2)">Kebersamaan Tim</div>
      <div data-anim="left" data-delay="0" style="background:linear-gradient(135deg,#db2777,#ea580c)">Pertandingan Persahabatan</div>
      <div data-anim="up" data-delay="100" style="background:linear-gradient(135deg,#1d4ed8,#16a34a)">Event Akademi</div>
  </div>
</div>
</main>

<!-- Footer (diatur di layout.js) -->
<div id="site-footer"></div>
